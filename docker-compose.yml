version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: appraisal_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: somani@123
      MYSQL_DATABASE: appraisal_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: .
    container_name: appraisal_backend

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/appraisal_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: somani@123

  frontend:
    build: ./appraisal-ui
    container_name: appraisal_frontend

    depends_on:
      - backend

    ports:
      - "80:80"

volumes:
  mysql-data: